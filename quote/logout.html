<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">

    <script defer src="./js/script.js"></script>
    <title>Quote</title>
</head>
<body>
    <!--HEADER-->
    <header class="header">
        <input type="search" class="header_search" placeholder=" 🔍︎ Pesquise por outros Quoters">
        <div class="header_user">
            <span class="user_name">Murilo Teixeira</span>
        </div>
    </header>
    <!--SIDEBAR-->
    <aside class="sidebar">
        <img src="./img/logoquote.png" class="sidebar_logo">
        <nav class="sidebar_nav">
            <a href="home.html" class="sidebar_item">
                <i data-lucide="house"></i>
                Home
            </a>
            <a href="search.html" class="sidebar_item">
                <i data-lucide="search"></i>
                Search
            </a>
            <a href="chat.html" class="sidebar_item">
                <i data-lucide="message-circle"></i>
                Chat
            </a>
            <a href="create.html" class="sidebar_item">
                <i data-lucide="circle-plus"></i>
                Create
            </a>
            <a href="settings.html" class="sidebar_item">
                <i data-lucide="settings"></i>
                Settings
            </a>
        </nav>
        <div class="sidebar_profile">
            <a href="profile.html" class="sidebar_logout">
                <i data-lucide="user-round-pen"></i>
                <span class="profile_@">
                @muriloooootc
                </span>
            </a>
            <a href="#" class="sidebar_logout sidebar_logout--active">
                <i class="icon--active"data-lucide="log-out"></i>
                Log-out
            </a>
        </div>


    </aside>

    <div class="logout_tela">
        <div class="logout_icon">
            <i class="icon--active"data-lucide="log-out"></i>
        </div>
        <p class="message_logout">
            Tem certeza que deseja sair? Você precisará fazer login novamente para ter acesso a sua conta!
        </p>
        <div class="button_logout">
            <a href="index.html"><button class="sim_button">Sim, sair</button></a>
            <a href="home.html"><button class="cancel_button">Cancelar</button></a>
        </div>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
