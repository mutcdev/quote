    <link rel="stylesheet" href="./css/style.css">
    <title>login</title>

<body>
    <main class="mainLogin">
        <div class="fundoLogin"></div>
        <div class="containerLogin">
            <div class="mensagelogin">
                <h1 class="titleLogin">
                    Bem-vindo de Volta!
                </h1>
                <p class="message_login">
                    Entre com a sua conta aqui.
                </p>
            </div>
            <div class="camposlogin">
                <label type="text" class="label_emailLogin">Email ou Username</label>
                <input class="emailLogin" type="text" placeholder="Insira seu Email ou Username">
    
                <label type="text" class="label_emailLogin">Senha</label>
                <input class="passwordLogin" type="password" placeholder="Entre com sua Senha" maxlength="8">

            </div>

            <button class="login_button" onclick="login()">Log In</button>

            <p class="message_continueLogin">
                Ou continue com
            </p>
            <div class="continuarcomLogin">
                <button class="google_button" onclick="google()">Google</button>
                <button class="facebook_button" onclick="facebook()">Facebook</button>


            </div>

            <p class="message_signup">
                Não tem uma conta?<a href="signup.html" class="signup"> Criar Conta</a>
            </p>
        </div>
    </main>
    <script>
        let email = document.querySelector('.emailLogin');
        let password = document.querySelector('.passwordLogin');

        function login(){

            let digitouAlgo = false;
            let emailOk = false

            if(email.value !== '' && password.value !== ''){
                digitouAlgo=true;
            }

            if(email.value.includes('@')){
                emailOk=true;
            }

            if(emailOk === true && digitouAlgo === true){
                window.location.href='home.html'
            }
        }
    </script>
